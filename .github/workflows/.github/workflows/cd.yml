name: CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, ci-cd ]

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Criar artefato zip
        run: zip -r calculadora-python.zip . -x "*.git*"

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-python-artifact
          path: calculadora-python.zip
